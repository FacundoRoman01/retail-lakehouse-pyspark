version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_lakehouse
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: retail_analytics
      MYSQL_USER: data_engineer
      MYSQL_PASSWORD: data_password123
    ports:
      - "3307:3306"
    volumes:
      - mysql_lakehouse_data:/var/lib/mysql

volumes:
  mysql_lakehouse_data: